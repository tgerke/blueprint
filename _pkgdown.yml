url: https://tgerke.github.io/blueprint/
template:
  bootstrap: 5
  theme: arrow-light
  bslib:
    bootswatch: flatly
    primary: "#4972C1"
    base_font: {google: "Roboto"}
    heading_font: {google: "Big Shoulders Inline"}
    code_font: {google: "Fira Code"}

logo: man/figures/logo.jpg

home:
  sidebar:
    structure: [links, license, authors, dev]
  links:
  - text: Wu et al. (2020) Paper
    href: https://doi.org/10.1002/pst.1983
  - text: Jing et al. (2022) Paper
    href: https://doi.org/10.1002/sim.9576
  - text: Cunanan et al. (2017) Paper
    href: https://doi.org/10.1002/sim.7227

reference:
  - title: "Design grammar"
    desc: "Construct, search, simulate, and verify designs through a shared modular interface"
    contents:
      - design_simon
      - search_simon_designs
      - pick_design
      - assume_response
      - assume_survival
      - assume_null
      - assume_alternative
      - evaluate
      - evaluate.simon_design
      - verify
      - simulate_trial.simon_design
      - summary.simon_design
      - tidy.simon_design
      - draft_protocol_text
      - is_trial_design
      - reexports
  - title: "Two-Stage Time-to-Event Designs"
    desc: "Functions for calculating two-stage single-arm trial designs with time-to-event endpoints"
    contents:
      - two_stage_single_arm_tte
      - print.two_stage_design
      - summary.two_stage_design
      - print.summary.two_stage_design
  - title: "Single-Stage Time-to-Event Designs"
    desc: "Functions for calculating single-stage single-arm trial designs with time-to-event endpoints"
    contents:
      - single_stage_single_arm_tte
  - title: "Basket Trial Designs"
    desc: "Functions for two-stage basket trial designs with binary endpoints"
    contents:
      - two_stage_basket_trial
      - print.basket_trial_design
      - summary.basket_trial_design
      - print.summary.basket_trial_design
  - title: "Simple Basket Trial Designs"
    desc: "Adaptive two-stage basket trial with heterogeneity assessment (Cunanan et al. 2017)"
    contents:
      - simple_basket_trial
      - simulate_simple_operating_characteristics
      - simulate_simple_trial_once
      - test_heterogeneity
      - print.simple_basket_design
      - summary.simple_basket_design
      - print.summary.simple_basket_design
  - title: Simulation Functions
    desc: Functions for simulating trials and validating operating characteristics
    contents:
    - simulate_trial
    - simulate_two_stage_tte
    - simulate_single_stage_tte
    - simulate_basket_trial
    - simulate_operating_characteristics
    - simulate_basket_operating_characteristics
  - title: Statistical Functions
    desc: Statistical test functions
    contents:
    - logrank_stat_wu

articles:
  - title: "Design grammar"
    desc: "The modular design workflow: search, construct, simulate, verify"
    contents:
      - design-grammar
  - title: "Two-Stage Time-to-Event Designs"
    desc: "Two-stage TTE design workflow and examples"
    contents:
      - two-stage-tte
  - title: "Single-Stage Time-to-Event Designs"
    desc: "Single-stage TTE design workflow with simulations"
    contents:
      - articles/single-stage-simulations
  - title: "Basket Trial Designs"
    desc: "Basket trial design workflow and validation"
    contents:
      - basket-trial
      - articles/jing-validation
      - simple-basket
  - title: "Validation"
    desc: "Comparison with published methodology"
    contents:
      - articles/wu-validation
      - articles/jing-validation
      - articles/single-stage-validation

navbar:
  structure:
    left:  [intro, reference, articles, tutorials, news]
    right: [search, github]
